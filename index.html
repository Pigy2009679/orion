<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f6fb"><meta name="description" content="ORION — a personal cross-platform desktop experience.">
<link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml">
<title>ORION</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:#202638;background:#edf1f8;--accent:#5269d9;--surface:rgba(255,255,255,.88);--line:#e5e9f1;--muted:#788197;--shadow:0 18px 60px #26365324}
*{box-sizing:border-box}body{margin:0;min-height:100vh;overflow:hidden;background:radial-gradient(ellipse at 15% 12%,#dbe8ff 0,transparent 34%),radial-gradient(ellipse at 90% 82%,#e7dcff 0,transparent 32%),linear-gradient(135deg,#f4f7fc,#e8edf7);transition:background .25s}button,input,textarea{font:inherit}button{cursor:pointer}.desktop{height:100dvh;position:relative;padding:22px 24px 94px}.topbar{height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border:1px solid #ffffffb8;background:#ffffff9c;backdrop-filter:blur(20px);border-radius:16px;box-shadow:0 4px 22px #24334c0b}.brand{display:flex;gap:10px;align-items:center;font-weight:750;letter-spacing:.12em}.orb{width:27px;height:27px;border-radius:9px;background:linear-gradient(145deg,#7188ff,#394bb7);display:grid;place-items:center;color:white;font-size:15px}.status{display:flex;gap:16px;align-items:center;color:#586178;font-size:13px}.desk-icons{display:grid;grid-template-columns:repeat(1,86px);gap:14px;margin-top:30px;width:100px}.desk-icon{border:0;background:transparent;color:#30394d;padding:10px 4px;border-radius:13px;display:grid;justify-items:center;gap:7px;font-size:12px}.desk-icon:hover{background:#ffffff80}.appglyph{width:42px;height:42px;border-radius:14px;background:#fff;box-shadow:0 5px 15px #34415b16;display:grid;place-items:center;color:var(--accent);font-size:19px;font-weight:700}.window{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);width:min(780px,calc(100vw - 60px));height:min(540px,calc(100dvh - 180px));background:var(--surface);backdrop-filter:blur(28px);border:1px solid #ffffffd9;border-radius:18px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;animation:appear .18s ease;min-width:280px}.window.hidden{display:none}.window.max{width:calc(100vw - 48px);height:calc(100dvh - 150px)}@keyframes appear{from{opacity:0;transform:translate(-50%,-48%) scale(.98)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}.winhead{height:48px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 15px;border-bottom:1px solid var(--line);background:#ffffff8a}.wintitle{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:700}.wincontrols{display:flex;gap:7px}.wincontrols button{border:0;background:#edf0f6;color:#647087;width:25px;height:25px;border-radius:8px}.winbody{padding:22px;overflow:auto;flex:1}.welcome{font-size:clamp(26px,4vw,40px);letter-spacing:-.04em;margin:4px 0 8px}.sub{color:var(--muted);font-size:14px}.search{display:flex;gap:8px;margin:25px 0 22px}.search input,.field{border:1px solid var(--line);background:white;border-radius:11px;padding:12px 14px;outline:none;min-width:0}.search input{flex:1}.primary{border:0;background:var(--accent);color:white;padding:0 18px;border-radius:11px;font-weight:650}.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px}.tile{background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px;text-align:left;color:#263047;min-height:95px}.tile strong{display:block;margin:10px 0 4px}.tile small{color:var(--muted)}.dockwrap{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);max-width:calc(100vw - 24px)}.dock{display:flex;gap:7px;padding:9px 12px;border:1px solid #ffffffd9;border-radius:20px;background:#ffffffb8;backdrop-filter:blur(24px);box-shadow:0 8px 35px #25334d20}.dock button{border:0;background:#fff;width:47px;height:47px;border-radius:14px;color:var(--accent);font-size:19px;box-shadow:0 2px 8px #26365312;transition:.15s}.dock button:hover{transform:translateY(-5px)}.muted{color:var(--muted)}.note{width:100%;height:100%;min-height:270px;resize:none;border:1px solid var(--line);border-radius:12px;padding:14px;line-height:1.6;outline:none}.browserbar{display:flex;gap:8px}.browserbar input{flex:1}.browserframe{width:100%;height:calc(100% - 58px);border:1px solid var(--line);border-radius:12px;margin-top:12px;background:white}.filelist{display:grid;gap:8px}.fileitem{display:flex;justify-content:space-between;padding:12px;background:#fff;border:1px solid var(--line);border-radius:10px}.settingsrow{display:flex;align-items:center;justify-content:space-between;padding:15px 0;border-bottom:1px solid var(--line);gap:12px}.switch{accent-color:var(--accent);width:19px;height:19px}.colorbtn{width:27px;height:27px;border-radius:50%;border:2px solid white;box-shadow:0 0 0 1px #ccd2df}.mobilehint{display:none}
body.dark{color:#edf1fb;background:radial-gradient(ellipse at 15% 12%,#202c50 0,transparent 40%),linear-gradient(135deg,#101522,#171d2e);--surface:rgba(29,37,56,.94);--line:#38435a;--muted:#a5afc3;--shadow:0 18px 60px #0008}body.dark .topbar,body.dark .dock,body.dark .winhead{background:#202a40d9;border-color:#46516a}body.dark .status,body.dark .desk-icon{color:#e0e7f5}body.dark .appglyph,body.dark .tile,body.dark .field,body.dark .search input,body.dark .note,body.dark .fileitem{background:#222d43;color:#edf1fb;border-color:#3b4760}body.dark .wincontrols button{background:#35415a;color:#e6ebf5}body.dark .dock button{background:#34415b;color:#dfe6ff}
@media(max-width:650px){.desktop{padding:10px 10px 82px}.topbar{height:43px;padding:0 12px}.desk-icons{display:none}.status{gap:9px;font-size:12px}.window{width:calc(100vw - 16px);height:calc(100dvh - 112px);top:calc(50% + 8px);border-radius:16px}.window.max{width:calc(100vw - 16px);height:calc(100dvh - 112px)}.winbody{padding:16px}.dockwrap{bottom:9px}.dock{gap:5px;padding:7px}.dock button{width:43px;height:43px}.mobilehint{display:block}.welcome{font-size:29px}}
</style>
</head>
<body>
<div class="desktop">
<header class="topbar"><div class="brand"><span class="orb">O</span> ORION</div><div class="status"><span id="date"></span><strong id="clock"></strong><button id="quickSettings" aria-label="Open settings" style="border:0;background:transparent;color:inherit">⚙</button></div></header>
<div class="desk-icons">
<button class="desk-icon" data-app="files"><span class="appglyph">▤</span>Files</button>
<button class="desk-icon" data-app="browser"><span class="appglyph">◎</span>Browser</button>
<button class="desk-icon" data-app="notes"><span class="appglyph">▧</span>Notes</button>
<button class="desk-icon" data-app="settings"><span class="appglyph">⚙</span>Settings</button>
</div>
<section class="window" id="window" aria-label="ORION Home">
<div class="winhead"><div class="wintitle"><span class="orb">O</span><span id="windowTitle">Welcome to ORION</span></div><div class="wincontrols"><button id="minimize" title="Minimize">—</button><button id="maximize" title="Maximize">□</button><button id="close" title="Close">×</button></div></div>
<div class="winbody" id="content"></div>
</section>
<div class="dockwrap"><nav class="dock" aria-label="App dock">
<button data-app="home" title="Home">⌂</button><button data-app="browser" title="Browser">◎</button><button data-app="files" title="Files">▤</button><button data-app="notes" title="Notes">▧</button><button data-app="calculator" title="Calculator">＋</button><button data-app="settings" title="Settings">⚙</button>
</nav></div>
</div>
<script>
const $=s=>document.querySelector(s), content=$('#content'), win=$('#window');
let active='home', notes=localStorage.getItem('orion-notes')||'', files=JSON.parse(localStorage.getItem('orion-files')||'[]'), maximized=false;
const apps={home:['Welcome to ORION','⌂'],browser:['ORION Browser','◎'],files:['Files','▤'],notes:['Notes','▧'],calculator:['Calculator','＋'],settings:['Settings','⚙'],about:['About ORION','O']};
function openApp(name){if(!apps[name])return;active=name;win.classList.remove('hidden');$('#windowTitle').textContent=apps[name][0];render()}
function render(){const views={
home:`<p class="sub">YOUR SPACE. YOUR WORKFLOW.</p><h1 class="welcome">Welcome back.</h1><p class="sub">A familiar desktop experience that works across your devices.</p><form class="search" id="websearch"><input id="query" placeholder="Search the web or enter a website" aria-label="Search the web"><button class="primary">Search</button></form><div class="tiles"><button class="tile" data-app="browser">◎<strong>Browser</strong><small>Search and explore the web</small></button><button class="tile" data-app="files">▤<strong>Files</strong><small>Your saved ORION files</small></button><button class="tile" data-app="notes">▧<strong>Notes</strong><small>Write and save notes</small></button><button class="tile" data-app="settings">⚙<strong>Settings</strong><small>Make ORION yours</small></button></div><p class="mobilehint sub" style="margin-top:22px">Tip: use the dock below to switch apps.</p>`,
browser:`<p class="sub">Search the web or open a site. External pages open in a new tab for compatibility.</p><form class="search" id="browsersearch"><input id="browserquery" placeholder="Search or enter a URL"><button class="primary">Go</button></form><div class="tiles"><button class="tile" data-url="https://www.google.com">◎<strong>Google</strong><small>Web search</small></button><button class="tile" data-url="https://www.wikipedia.org">W<strong>Wikipedia</strong><small>Knowledge library</small></button><button class="tile" data-url="https://www.youtube.com">▶<strong>YouTube</strong><small>Videos</small></button></div>`,
files:`<p class="sub">Files saved inside this ORION app on this device.</p><form class="search" id="fileform"><input id="filename" placeholder="New file name"><button class="primary">Create</button></form><div class="filelist">${files.length?files.map((f,i)=>`<div class="fileitem"><span>▤ &nbsp;${escapeHTML(f)}</span><button data-delete="${i}" style="border:0;background:transparent;color:#b45b68">Delete</button></div>`).join(''):'<p class="sub">No files yet. Create a file name above to get started.</p>'}</div><p class="sub" style="margin-top:18px">Note: this is app storage, not direct access to your device folders.</p>`,
notes:`<p class="sub">Notes are saved automatically on this device.</p><textarea class="note" id="notepad" placeholder="Start writing...">${escapeHTML(notes)}</textarea><p class="sub" id="saved">Saved locally</p>`,
calculator:`<p class="sub">A simple calculator for everyday maths.</p><input class="field" id="calcdisplay" value="0" readonly style="width:100%;font-size:28px;text-align:right;margin-bottom:12px"><div class="tiles" style="grid-template-columns:repeat(4,1fr)">${['7','8','9','÷','4','5','6','×','1','2','3','−','0','.','C','+','=','⌫'].map(k=>`<button class="tile calc-key" data-key="${k}" style="min-height:58px;text-align:center;font-size:19px">${k}</button>`).join('')}</div>`,
settings:`<h2 style="margin-top:0">Personalization</h2><div class="settingsrow"><div><strong>Dark appearance</strong><div class="sub">Switch between light and dark</div></div><input class="switch" type="checkbox" id="darkmode"></div><div class="settingsrow"><div><strong>Accent color</strong><div class="sub">Choose your interface color</div></div><div style="display:flex;gap:9px">${['#5269d9','#168b78','#a45ac5','#d47b36','#d14f70'].map(c=>`<button class="colorbtn" data-color="${c}" style="background:${c}" aria-label="Choose accent"></button>`).join('')}</div></div><div class="settingsrow"><div><strong>App information</strong><div class="sub">ORION cross-platform preview</div></div><button class="tile" data-app="about" style="min-height:auto;padding:9px 13px">About</button></div><p class="sub">Your theme and notes are stored locally in this browser.</p>`,
about:`<h1 class="welcome">ORION</h1><p class="sub">A cross-platform desktop-style web app for Windows, Android, and iPhone.</p><div class="tile"><strong>Current version</strong><small>0.2.0 — Foundation</small></div><p class="sub">ORION is a web app, not a replacement for Windows, Android, or iOS. Device-level features require platform permissions or a native app.</p>`
};content.innerHTML=views[active]||views.home;wire()}
function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function go(url){let u=url.trim();if(!u)return;if(!/^https?:\/\//i.test(u)){u=/^[\w-]+\.[a-z]{2,}/i.test(u)?'https://'+u:'https://www.google.com/search?q='+encodeURIComponent(u)}window.open(u,'_blank','noopener,noreferrer')}
function wire(){content.querySelectorAll('[data-app]').forEach(b=>b.addEventListener('click',()=>openApp(b.dataset.app)));content.querySelectorAll('[data-url]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.url)));
$('#websearch')?.addEventListener('submit',e=>{e.preventDefault();go($('#query').value)});
$('#browsersearch')?.addEventListener('submit',e=>{e.preventDefault();go($('#browserquery').value)});
$('#fileform')?.addEventListener('submit',e=>{e.preventDefault();let n=$('#filename').value.trim();if(n){files.push(n);localStorage.setItem('orion-files',JSON.stringify(files));render()}});
content.querySelectorAll('[data-delete]').forEach(b=>b.addEventListener('click',()=>{files.splice(+b.dataset.delete,1);localStorage.setItem('orion-files',JSON.stringify(files));render()}));
$('#notepad')?.addEventListener('input',e=>{notes=e.target.value;localStorage.setItem('orion-notes',notes);$('#saved').textContent='Saved locally'});
$('#darkmode')?.addEventListener('change',e=>{document.body.classList.toggle('dark',e.target.checked);localStorage.setItem('orion-dark',e.target.checked?'1':'0')});
content.querySelectorAll('[data-color]').forEach(b=>b.addEventListener('click',()=>{document.documentElement.style.setProperty('--accent',b.dataset.color);localStorage.setItem('orion-accent',b.dataset.color)}));
content.querySelectorAll('.calc-key').forEach(b=>b.addEventListener('click',()=>calc(b.dataset.key)));
}
let calcExpr='';function calc(k){const d=$('#calcdisplay');if(!d)return;if(k==='C')calcExpr='';else if(k==='⌫')calcExpr=calcExpr.slice(0,-1);else if(k==='='){try{let safe=calcExpr.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-');if(!/^[0-9+*/().\s-]+$/.test(safe))throw 0;let v=Function('"use strict";return ('+safe+')')();calcExpr=Number.isFinite(v)?String(v):''}catch{calcExpr='Error'}}else calcExpr+=k;d.value=calcExpr||'0'}
$('#minimize').onclick=()=>win.classList.add('hidden');$('#close').onclick=()=>win.classList.add('hidden');$('#maximize').onclick=()=>{maximized=!maximized;win.classList.toggle('max',maximized)};
$('#quickSettings').onclick=()=>openApp('settings');document.querySelectorAll('.dock [data-app]').forEach(b=>b.addEventListener('click',()=>openApp(b.dataset.app)));
document.querySelectorAll('.desk-icons [data-app]').forEach(b=>b.addEventListener('click',()=>openApp(b.dataset.app)));
function tick(){let d=new Date();$('#clock').textContent=d.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'});$('#date').textContent=d.toLocaleDateString([], {month:'short',day:'numeric'})}tick();setInterval(tick,15000);
if(localStorage.getItem('orion-dark')==='1')document.body.classList.add('dark');if(localStorage.getItem('orion-accent'))document.documentElement.style.setProperty('--accent',localStorage.getItem('orion-accent'));
openApp('home');if('serviceWorker'in navigator&&location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script>
</body></html>
