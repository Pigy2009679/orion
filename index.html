<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3f5fb">
<meta name="description" content="ORION — a personal desktop experience for your devices.">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<title>ORION</title>
<style>
:root{color-scheme:light;--accent:#6478e8;--accent2:#8b9aff;--ink:#20263a;--muted:#778097;--line:#e6e9f2;--panel:rgba(255,255,255,.82);--solid:#fff;--shadow:0 24px 80px #28375b24;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{color:var(--ink);background:radial-gradient(ellipse at 12% 8%,#d9e5ff 0,transparent 38%),radial-gradient(ellipse at 88% 85%,#eadfff 0,transparent 34%),linear-gradient(135deg,#f7f8fc,#e9eef8);transition:background .25s,color .25s}button,input,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #8798ff88;outline-offset:2px}
.desktop{height:100dvh;position:relative;padding:18px 22px 92px}.topbar{height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 17px;border:1px solid #ffffffc9;background:#ffffff9c;backdrop-filter:blur(24px);border-radius:17px;box-shadow:0 5px 25px #24334c0c}.brand{display:flex;gap:11px;align-items:center;font-weight:800;letter-spacing:.16em;font-size:13px}.orb{width:30px;height:30px;border-radius:10px;background:linear-gradient(145deg,#8da0ff,#5366d4 68%,#3d4da8);display:grid;place-items:center;color:white;font-size:16px;box-shadow:0 5px 14px #596cce55}.status{display:flex;gap:15px;align-items:center;color:#586178;font-size:13px}.status button{border:0;background:#ffffffa6;border-radius:10px;padding:7px 10px;color:inherit}
.wallpaper-label{position:absolute;right:32px;top:105px;text-align:right;pointer-events:none}.wallpaper-label b{display:block;font-size:clamp(25px,4vw,43px);letter-spacing:-.06em;color:#66749a22}.wallpaper-label span{font-size:11px;letter-spacing:.24em;color:#69769675}
.desk-icons{position:absolute;top:100px;left:22px;display:grid;gap:12px;width:86px}.desk-icon{border:0;background:transparent;color:#30394d;padding:9px 3px;border-radius:14px;display:grid;justify-items:center;gap:7px;font-size:11px}.desk-icon:hover{background:#ffffff88}.appglyph{width:43px;height:43px;border-radius:15px;background:linear-gradient(145deg,#fff,#f2f4fb);box-shadow:0 6px 18px #34415b17;display:grid;place-items:center;color:var(--accent);font-size:20px;font-weight:700}
.window{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);width:min(820px,calc(100vw - 145px));height:min(570px,calc(100dvh - 160px));min-width:300px;background:var(--panel);backdrop-filter:blur(30px);border:1px solid #ffffffed;border-radius:21px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;animation:appear .2s ease;transition:width .2s,height .2s}.window.hidden{display:none}.window.max{width:calc(100vw - 44px);height:calc(100dvh - 142px)}@keyframes appear{from{opacity:0;transform:translate(-50%,-48%) scale(.985)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
.winhead{height:53px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 17px;border-bottom:1px solid var(--line);background:#ffffff9c;touch-action:pan-y}.wintitle{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:750}.mini-orb{width:25px;height:25px;border-radius:8px;background:linear-gradient(145deg,#8da0ff,#5366d4);color:#fff;display:grid;place-items:center;font-size:13px}.wincontrols{display:flex;gap:7px}.wincontrols button{border:0;background:#eef0f7;color:#68728a;width:27px;height:27px;border-radius:9px;font-size:15px}.wincontrols button:last-child:hover{background:#ffe3e8;color:#b23d56}.winbody{padding:25px;overflow:auto;flex:1}.welcome{font-size:clamp(29px,4vw,43px);letter-spacing:-.055em;margin:5px 0 8px}.eyebrow{font-size:10px;font-weight:800;letter-spacing:.2em;color:var(--accent)}.sub{color:var(--muted);font-size:13px;line-height:1.55}.search{display:flex;gap:9px;margin:24px 0 22px}.search input,.field{border:1px solid var(--line);background:var(--solid);color:var(--ink);border-radius:12px;padding:12px 14px;outline:none;min-width:0}.search input{flex:1}.primary{border:0;background:linear-gradient(135deg,var(--accent),#5365d1);color:white;padding:0 20px;border-radius:12px;font-weight:700;box-shadow:0 6px 14px #596cce33}.primary:hover{filter:brightness(1.06);transform:translateY(-1px)}.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:13px}.tile{background:var(--solid);border:1px solid var(--line);border-radius:16px;padding:17px;text-align:left;color:var(--ink);min-height:105px;box-shadow:0 4px 13px #27365308;transition:transform .16s,box-shadow .16s}.tile:hover{transform:translateY(-3px);box-shadow:0 10px 24px #27365312}.tile .tileicon{font-size:20px;color:var(--accent)}.tile strong{display:block;margin:10px 0 4px;font-size:13px}.tile small{color:var(--muted);font-size:11px;line-height:1.4}.dockwrap{position:absolute;bottom:17px;left:50%;transform:translateX(-50%);max-width:calc(100vw - 24px)}.dock{display:flex;gap:8px;padding:9px 12px;border:1px solid #ffffffdf;border-radius:21px;background:#ffffffbf;backdrop-filter:blur(28px);box-shadow:0 10px 35px #25334d20}.dock button{border:1px solid transparent;background:linear-gradient(145deg,#fff,#f1f3fa);width:48px;height:48px;border-radius:15px;color:var(--accent);font-size:20px;box-shadow:0 3px 9px #26365312;transition:.16s}.dock button:hover,.dock button.active{transform:translateY(-5px);border-color:#cbd3ff;box-shadow:0 8px 17px #596cce24}.dock button.active:after{content:"";display:block;width:4px;height:4px;background:var(--accent);border-radius:50%;margin:2px auto 0}
.note{width:100%;height:100%;min-height:300px;resize:vertical;border:1px solid var(--line);border-radius:13px;padding:15px;line-height:1.6;outline:none;background:var(--solid);color:var(--ink)}.filelist{display:grid;gap:9px}.fileitem{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;background:var(--solid);border:1px solid var(--line);border-radius:12px;font-size:13px}.fileitem button{border:0;background:#fff0f2;color:#b34d62;padding:7px 10px;border-radius:9px}.settingsrow{display:flex;align-items:center;justify-content:space-between;padding:17px 0;border-bottom:1px solid var(--line);gap:14px}.switch{accent-color:var(--accent);width:19px;height:19px}.colorbtn{width:28px;height:28px;border-radius:50%;border:3px solid white;box-shadow:0 0 0 1px #ccd2df}.calcgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.calcgrid button{min-height:54px;text-align:center;font-size:18px;padding:8px}.calcdisplay{width:100%;font-size:29px;text-align:right;margin-bottom:13px;font-weight:650}.pill{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:5px 10px;color:var(--muted);font-size:11px}.mobilehint{display:none}
body.dark{color-scheme:dark;--ink:#edf1fb;--muted:#a5afc3;--line:#38445d;--panel:rgba(27,35,54,.92);--solid:#222d43;--shadow:0 20px 70px #0008;background:radial-gradient(ellipse at 15% 10%,#26345b 0,transparent 42%),linear-gradient(135deg,#111827,#1a2032)}body.dark .topbar,body.dark .dock,body.dark .winhead{background:#202a40db;border-color:#46516a}body.dark .status,body.dark .desk-icon{color:#e0e7f5}body.dark .appglyph,body.dark .tile,body.dark .field,body.dark .search input,body.dark .note,body.dark .fileitem{background:#222d43;color:#edf1fb;border-color:#3b4760}body.dark .wincontrols button{background:#35415a;color:#e6ebf5}body.dark .dock button{background:#34415b;color:#dfe6ff}body.dark .status button{background:#34415b;color:#e6ebf5}body.dark .wallpaper-label b{color:#dce5ff16}
@media(max-width:700px){.desktop{padding:9px 9px 82px}.topbar{height:46px;padding:0 12px}.desk-icons,.wallpaper-label{display:none}.status{gap:8px;font-size:11px}.window{width:calc(100vw - 16px);height:calc(100dvh - 108px);top:calc(50% + 7px);min-width:0;border-radius:17px}.window.max{width:calc(100vw - 16px);height:calc(100dvh - 108px)}.winhead{height:48px;padding:0 12px}.winbody{padding:17px}.dockwrap{bottom:8px}.dock{gap:5px;padding:7px;border-radius:17px}.dock button{width:43px;height:43px;border-radius:13px}.mobilehint{display:block}.welcome{font-size:31px}.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.tile{min-height:95px;padding:13px}.search{margin:19px 0}.calcgrid{gap:7px}.calcgrid button{min-height:49px}}
@media(max-width:360px){.dock{gap:3px;padding:6px}.dock button{width:39px;height:41px}.brand{letter-spacing:.1em}.status{gap:5px}.status button{padding:6px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="desktop">
<header class="topbar"><div class="brand"><span class="orb">O</span> ORION</div><div class="status"><span id="date"></span><strong id="clock"></strong><button id="quickSettings" aria-label="Open settings" title="Settings">⚙</button></div></header>
<div class="wallpaper-label"><b>Make space<br>for what matters.</b><span>ORION DESKTOP</span></div>
<div class="desk-icons" aria-label="Desktop shortcuts">
<button class="desk-icon" data-app="files"><span class="appglyph">▤</span>Files</button>
<button class="desk-icon" data-app="browser"><span class="appglyph">◎</span>Browser</button>
<button class="desk-icon" data-app="notes"><span class="appglyph">▧</span>Notes</button>
<button class="desk-icon" data-app="settings"><span class="appglyph">⚙</span>Settings</button>
</div>
<section class="window" id="window" aria-label="ORION app window">
<div class="winhead" id="winhead"><div class="wintitle"><span class="mini-orb">O</span><span id="windowTitle">Home</span></div><div class="wincontrols"><button id="minimize" title="Minimize" aria-label="Minimize">−</button><button id="maximize" title="Maximize" aria-label="Maximize">□</button><button id="close" title="Close" aria-label="Close">×</button></div></div>
<div class="winbody" id="content"></div>
</section>
<div class="dockwrap"><nav class="dock" aria-label="App dock">
<button data-app="home" title="Home" aria-label="Home">⌂</button><button data-app="browser" title="Browser" aria-label="Browser">◎</button><button data-app="files" title="Files" aria-label="Files">▤</button><button data-app="notes" title="Notes" aria-label="Notes">▧</button><button data-app="calculator" title="Calculator" aria-label="Calculator">＋</button><button data-app="settings" title="Settings" aria-label="Settings">⚙</button>
</nav></div>
</div>
<script>
'use strict';
const $=s=>document.querySelector(s), content=$('#content'), win=$('#window');
const safeGet=(key,fallback)=>{try{const v=localStorage.getItem(key);return v===null?fallback:v}catch{return fallback}};
const safeSet=(key,value)=>{try{localStorage.setItem(key,value);return true}catch{return false}};
const safeArray=(key)=>{try{const v=JSON.parse(safeGet(key,'[]'));return Array.isArray(v)?v.filter(x=>typeof x==='string'):[]}catch{return []}};
let active='home',notes=safeGet('orion-notes',''),files=safeArray('orion-files'),maximized=false,calcExpr='',drag=null;
const apps={home:'Home',browser:'ORION Browser',files:'Files',notes:'Notes',calculator:'Calculator',settings:'Settings',about:'About ORION'};
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function openApp(name){if(!apps[name])return;active=name;win.classList.remove('hidden');$('#windowTitle').textContent=apps[name];render();document.querySelectorAll('.dock [data-app]').forEach(b=>b.classList.toggle('active',b.dataset.app===name))}
function render(){
const views={
home:`<div class="eyebrow">YOUR SPACE. YOUR WORKFLOW.</div><h1 class="welcome">A little more room<br>to think clearly.</h1><p class="sub">A calm, familiar workspace that follows you across your devices.</p><form class="search" id="websearch"><input id="query" placeholder="Search the web or enter a website" aria-label="Search the web"><button class="primary">Search</button></form><div class="tiles"><button class="tile" data-app="browser"><span class="tileicon">◎</span><strong>Browser</strong><small>Search and explore the web</small></button><button class="tile" data-app="files"><span class="tileicon">▤</span><strong>Files</strong><small>Keep a list of your work</small></button><button class="tile" data-app="notes"><span class="tileicon">▧</span><strong>Notes</strong><small>Ideas saved as you type</small></button><button class="tile" data-app="settings"><span class="tileicon">⚙</span><strong>Settings</strong><small>Make the workspace yours</small></button></div><p class="mobilehint sub" style="margin-top:20px">Use the dock below to switch apps.</p>`,
browser:`<div class="eyebrow">EXPLORE</div><h2 style="margin:6px 0">Where to next?</h2><p class="sub">Search the web or open a website in a new browser tab.</p><form class="search" id="browsersearch"><input id="browserquery" placeholder="Search or enter a URL" aria-label="Search or enter a URL"><button class="primary">Go</button></form><div class="tiles"><button class="tile" data-url="https://www.google.com"><span class="tileicon">◎</span><strong>Google</strong><small>Web search</small></button><button class="tile" data-url="https://www.wikipedia.org"><span class="tileicon">W</span><strong>Wikipedia</strong><small>Knowledge library</small></button><button class="tile" data-url="https://www.youtube.com"><span class="tileicon">▶</span><strong>YouTube</strong><small>Videos</small></button></div>`,
files:`<div class="eyebrow">YOUR SPACE</div><h2 style="margin:6px 0">Files</h2><p class="sub">Create a list of files and links you want to keep track of.</p><form class="search" id="fileform"><input id="filename" maxlength="100" placeholder="Name a file or add a link" aria-label="File name"><button class="primary">Add</button></form><div class="filelist">${files.length?files.map((f,i)=>`<div class="fileitem"><span>▤ &nbsp;${esc(f)}</span><button data-delete="${i}" aria-label="Delete ${esc(f)}">Remove</button></div>`).join(''):'<p class="sub">Nothing here yet. Add your first item above.</p>'}</div><p class="sub" style="margin-top:18px">This is a personal list stored in this browser. It does not access your device folders.</p>`,
notes:`<div class="eyebrow">QUICK CAPTURE</div><h2 style="margin:6px 0">Notes</h2><p class="sub">Your writing saves automatically on this device.</p><textarea class="note" id="notepad" placeholder="Start with an idea...">${esc(notes)}</textarea><p class="sub" id="saved" aria-live="polite">Saved on this device</p>`,
calculator:`<div class="eyebrow">TOOLS</div><h2 style="margin:6px 0">Calculator</h2><input class="field calcdisplay" id="calcdisplay" value="0" readonly aria-label="Calculator display"><div class="calcgrid">${['7','8','9','÷','4','5','6','×','1','2','3','−','0','.','C','+','⌫','=','(',')'].map(k=>`<button class="tile calc-key" data-key="${k}">${k}</button>`).join('')}</div><p class="sub">Calculations are evaluated locally.</p>`,
settings:`<div class="eyebrow">PREFERENCES</div><h2 style="margin:6px 0">Make it yours</h2><div class="settingsrow"><div><strong>Dark appearance</strong><div class="sub">A darker workspace for low light</div></div><input class="switch" type="checkbox" id="darkmode" ${safeGet('orion-dark','0')==='1'?'checked':''}></div><div class="settingsrow"><div><strong>Accent color</strong><div class="sub">Choose your interface color</div></div><div style="display:flex;gap:10px">${['#6478e8','#168b78','#a45ac5','#d47b36','#d14f70'].map(c=>`<button class="colorbtn" data-color="${c}" style="background:${c}" aria-label="Choose accent color ${c}"></button>`).join('')}</div></div><div class="settingsrow"><div><strong>About ORION</strong><div class="sub">Version 0.3.0 · Cross-platform web app</div></div><button class="tile" data-app="about" style="min-height:auto;padding:10px 14px">View</button></div><p class="sub">Your theme, notes, and file list are stored locally in this browser.</p>`,
about:`<div class="eyebrow">ABOUT</div><h1 class="welcome">ORION</h1><p class="sub">A desktop-inspired web app for Windows, Android, and iPhone.</p><div class="tile"><span class="tileicon">O</span><strong>Version 0.3.0</strong><small>Interface refresh and reliability update</small></div><p class="sub">ORION runs inside a browser. It is not a replacement operating system. Its Files area is a saved list, and Browser opens external sites in new tabs. Native device access requires platform permissions or a separate native app.</p>`
};
content.innerHTML=views[active]||views.home;wire();
}
function go(url){let u=String(url||'').trim();if(!u)return;if(!/^https?:\/\//i.test(u))u=/^[\w-]+\.[a-z]{2,}(?:[/:?#].*)?$/i.test(u)?'https://'+u:'https://www.google.com/search?q='+encodeURIComponent(u);try{const parsed=new URL(u);if(!['http:','https:'].includes(parsed.protocol))return;window.open(parsed.href,'_blank','noopener,noreferrer')}catch{}}
function wire(){
content.querySelectorAll('[data-app]').forEach(b=>b.addEventListener('click',()=>openApp(b.dataset.app)));
content.querySelectorAll('[data-url]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.url)));
$('#websearch')?.addEventListener('submit',e=>{e.preventDefault();go($('#query').value)});
$('#browsersearch')?.addEventListener('submit',e=>{e.preventDefault();go($('#browserquery').value)});
$('#filename')?.addEventListener('input',e=>e.target.setCustomValidity(''));
$('#fileform')?.addEventListener('submit',e=>{e.preventDefault();const n=$('#filename').value.trim();if(!n)return;if(files.includes(n)){$('#filename').setCustomValidity('That item is already on your list.');$('#filename').reportValidity();return}files.unshift(n);safeSet('orion-files',JSON.stringify(files));render()});
content.querySelectorAll('[data-delete]').forEach(b=>b.addEventListener('click',()=>{files.splice(Number(b.dataset.delete),1);safeSet('orion-files',JSON.stringify(files));render()}));
$('#notepad')?.addEventListener('input',e=>{notes=e.target.value;$('#saved').textContent=safeSet('orion-notes',notes)?'Saved on this device':'Storage is unavailable in this browser'});
$('#darkmode')?.addEventListener('change',e=>{document.body.classList.toggle('dark',e.target.checked);safeSet('orion-dark',e.target.checked?'1':'0')});
content.querySelectorAll('[data-color]').forEach(b=>b.addEventListener('click',()=>{document.documentElement.style.setProperty('--accent',b.dataset.color);safeSet('orion-accent',b.dataset.color)}));
content.querySelectorAll('.calc-key').forEach(b=>b.addEventListener('click',()=>calc(b.dataset.key)));
}
function evaluateExpression(source){
let s=source.replace(/[×]/g,'*').replace(/[÷]/g,'/').replace(/[−]/g,'-');let i=0;
function ws(){while(/\s/.test(s[i]||'')&&i<s.length)i++}
function primary(){ws();if(s[i]==='+'){i++;return primary()}if(s[i]==='-'){i++;return -primary()}if(s[i]==='('){i++;let v=expression();ws();if(s[i++]!==')')throw Error('Missing )');return v}let start=i;while(/[0-9.]/.test(s[i]||''))i++;if(start===i)throw Error('Number expected');let n=Number(s.slice(start,i));if(!Number.isFinite(n))throw Error('Invalid number');return n}
function term(){let v=primary();while(true){ws();let op=s[i];if(op!=='*'&&op!=='/')break;i++;let b=primary();if(op==='/'&&b===0)throw Error('Cannot divide by zero');v=op==='*'?v*b:v/b}return v}
function expression(){let v=term();while(true){ws();let op=s[i];if(op!=='+'&&op!=='-')break;i++;let b=term();v=op==='+'?v+b:v-b}return v}
let result=expression();ws();if(i!==s.length||!Number.isFinite(result))throw Error('Invalid expression');return String(Number(result.toPrecision(12)))
}
function calc(k){const d=$('#calcdisplay');if(!d)return;if(k==='C')calcExpr='';else if(k==='⌫')calcExpr=calcExpr.slice(0,-1);else if(k==='='){try{calcExpr=evaluateExpression(calcExpr)}catch{calcExpr='Error'}}else if(calcExpr==='Error')calcExpr='';if(k!=='C'&&k!=='⌫'&&k!=='='&&calcExpr!=='Error')calcExpr+=k;d.value=calcExpr||'0'}
$('#minimize').addEventListener('click',()=>win.classList.add('hidden'));
$('#close').addEventListener('click',()=>{win.classList.add('hidden');document.querySelectorAll('.dock [data-app]').forEach(b=>b.classList.remove('active'))});
$('#maximize').addEventListener('click',()=>{maximized=!maximized;win.classList.toggle('max',maximized)});
$('#quickSettings').addEventListener('click',()=>openApp('settings'));
document.querySelectorAll('.dock [data-app],.desk-icons [data-app]').forEach(b=>b.addEventListener('click',()=>openApp(b.dataset.app)));
function tick(){const d=new Date();$('#clock').textContent=d.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'});$('#date').textContent=d.toLocaleDateString([], {month:'short',day:'numeric'})}tick();setInterval(tick,30000);
if(safeGet('orion-dark','0')==='1')document.body.classList.add('dark');
const accent=safeGet('orion-accent','');if(/^#[0-9a-f]{6}$/i.test(accent))document.documentElement.style.setProperty('--accent',accent);
if('serviceWorker'in navigator&&location.protocol==='https:')window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
openApp('home');
</script>
</body></html>
