<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ORION Start</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;
font-family:system-ui,sans-serif;color:#203454;background:linear-gradient(135deg,#eaf4ff,#d9e4ff 55%,#eeeaff)}
main{width:min(720px,90vw);padding:52px 38px;text-align:center;border:1px solid #ffffffaa;
border-radius:26px;background:#ffffffb8;box-shadow:0 24px 70px #375b9620;backdrop-filter:blur(16px)}
h1{font-size:clamp(42px,8vw,72px);letter-spacing:.12em;margin:0;color:#345da8}
p{color:#5a6e8f;font-size:17px}.search{display:flex;gap:8px;margin:28px auto 0;max-width:560px}
input{min-width:0;flex:1;padding:15px 18px;border:1px solid #c6d5ee;border-radius:12px;font:inherit}
button{padding:0 22px;border:0;border-radius:12px;background:#416dca;color:white;font:inherit;cursor:pointer}
.links{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:24px}
a{color:#345da8;text-decoration:none;padding:8px 12px;border-radius:9px;background:#e9f0ff}
</style>
</head>
<body><main>
<h1>ORION</h1><p>Your desktop. Your space.</p>
<form class="search" action="https://www.google.com/search" method="get">
<input name="q" aria-label="Search the web" placeholder="Search the web">
<button type="submit">Search</button>
</form>
<div class="links"><a href="https://www.debian.org/">Debian</a><a href="https://www.wikipedia.org/">Wikipedia</a><a href="https://github.com/">GitHub</a></div>
</main></body></html>
